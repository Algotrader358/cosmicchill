services:
  - type: web
    name: cosmic-chill-limited
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_COMPANY_PHONE
        value: "254721992966"
      - key: NEXT_PUBLIC_COMPANY_EMAIL
        value: "cosmicchill254@gmail.com"
      - key: NEXT_PUBLIC_COMPANY_LOCATION
        value: "Grand Pri Building, Nandi Road, Eldoret, Kenya"
